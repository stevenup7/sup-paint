<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Watercolour Sketchpad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Tool bar on top, paper fills the rest, status line at the bottom. */
:root {
  --bar: #e7eae6;
  --bar-2: #d9ddd8;
  --ink: #1c2320;
  --muted: #59635e;
  --line: #c3c9c3;
  --accent: #2b479c;
  --accent-ink: #ffffff;
  --stage: #b9beb8;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bar: #1b1f1d; --bar-2: #262b28; --ink: #e3e7e4; --muted: #9ba59f;
    --line: #353d38; --accent: #93aaf0; --accent-ink: #0f1529; --stage: #0f1211;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bar: #1b1f1d; --bar-2: #262b28; --ink: #e3e7e4; --muted: #9ba59f;
  --line: #353d38; --accent: #93aaf0; --accent-ink: #0f1529; --stage: #0f1211;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bar); color: var(--ink); font-family: var(--sans); font-size: 14px; }
.app { display: flex; flex-direction: column; height: 100%; }

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  user-select: none; -webkit-user-select: none;
}
.group { display: flex; align-items: center; gap: 6px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }

.palette { gap: 5px; }
.pan {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
  padding: 0; cursor: pointer; background: var(--pan);
  outline-offset: 2px;
}
.pan[aria-checked="true"] { outline: 2px solid var(--ink); }
.pan:focus-visible { outline: 2px solid var(--accent); }
#colourName { min-width: 9.5em; font-weight: 500; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button {
  font: inherit; border: 0; background: transparent; color: var(--ink);
  padding: 6px 11px; cursor: pointer; min-height: 32px;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.slider { display: flex; align-items: center; gap: 7px; }
.slider input { width: 92px; accent-color: var(--accent); }
.slider output { font-family: var(--mono); font-size: 12px; min-width: 3.2em; color: var(--muted); font-variant-numeric: tabular-nums; }

.actions { margin-left: auto; }
.btn {
  font: inherit; border: 1px solid var(--line); background: var(--bar-2); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; min-height: 32px; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn:disabled { opacity: 0.45; cursor: default; }

.stage { position: relative; flex: 1; min-height: 0; background: var(--stage); overflow: hidden; }
#paper { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
#ring {
  position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%;
  border: 1px solid rgba(20, 24, 22, 0.55); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5);
}
.tuning {
  position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  width: min(340px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--bar); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); touch-action: auto;
}
.tune-head { display: flex; align-items: center; gap: 8px; }
.tune-head strong { flex: 1; font-weight: 600; }
.tune-rows { display: flex; flex-direction: column; gap: 12px; }
.tune-row label { font-weight: 500; font-size: 13px; }
.tune-ctl { display: flex; align-items: center; gap: 8px; }
.tune-ctl input { flex: 1; min-width: 0; accent-color: var(--accent); }
.tune-ctl output { font-family: var(--mono); font-size: 12px; min-width: 5.5em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.tune-desc { margin: 2px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
.tuning textarea { font-family: var(--mono); font-size: 11px; width: 100%; resize: vertical; background: var(--bar-2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
#msg {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
  text-align: center; color: var(--ink); background: var(--stage); line-height: 1.5;
}

.status {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 20px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); user-select: none; -webkit-user-select: none;
}
.status .stats { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.status kbd { font-family: var(--mono); font-size: 11px; }
.more select { font: inherit; padding: 4px; border-radius: 4px; border: 1px solid var(--line); background: var(--bar-2); color: var(--ink); }
.more label { display: flex; align-items: center; gap: 6px; }
@media (max-width: 700px) {
  .actions { margin-left: 0; }
  .slider input { width: 84px; }
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="group palette" role="radiogroup" aria-label="Colour" id="palette"></div>
    <span id="colourName">Ultramarine</span>

    <div class="group">
      <span class="label" id="toolLabel">Tool</span>
      <div class="seg" role="group" aria-labelledby="toolLabel" id="modes">
        <button type="button" id="modePaint" data-mode="0" aria-pressed="true">Paint</button>
        <button type="button" id="modeWater" data-mode="1" aria-pressed="false">Clean water</button>
        <button type="button" id="modeBlot" data-mode="2" aria-pressed="false">Blot</button>
      </div>
    </div>

    <label class="slider"><span class="label">Size</span>
      <input type="range" id="size" min="0" max="100" step="0.1" value="76.1"><output id="sizeOut">44 px</output></label>
    <label class="slider"><span class="label">Water</span>
      <input type="range" id="water" min="0" max="100" value="60"><output id="waterOut">60%</output></label>
    <label class="slider"><span class="label">Paint</span>
      <input type="range" id="pigment" min="5" max="100" value="55"><output id="pigmentOut">55%</output></label>
    <label class="slider"><span class="label">Flow</span>
      <input type="range" id="flow" min="0" max="100" value="90"><output id="flowOut">90%</output></label>
    <label class="slider"><span class="label">Paper texture</span>
      <input type="range" id="texture" min="0" max="100" value="40"><output id="textureOut">40%</output></label>
    <label class="slider"><span class="label">Drying time</span>
      <input type="range" id="drying" min="4" max="180" value="45"><output id="dryingOut">45 s</output></label>

    <div class="group more">
      <label><span class="label">Detail</span>
        <select id="detail">
          <option value="0.5">Low</option>
          <option value="0.75">Medium</option>
          <option value="1">High</option>
          <option value="1.5">Very high</option>
          <option value="2" selected>Ultra</option>
        </select>
      </label>
      <label><input type="checkbox" id="runsDry" checked><span class="label">Brush runs dry (lift pen to reload)</span></label>
    </div>

    <div class="group actions">
      <button type="button" class="btn" id="tuneOpen">Simulation settings</button>
      <button type="button" class="btn" id="undo" disabled>Undo</button>
      <button type="button" class="btn" id="dryNow">Dry now</button>
      <button type="button" class="btn" id="clear">Clear</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="paper"></canvas>
    <div id="ring" hidden></div>
    <div id="msg" hidden></div>
    <aside class="tuning" id="tuning" hidden aria-label="Simulation settings">
      <div class="tune-head">
        <strong>Simulation settings</strong>
        <button type="button" class="btn" id="tuneReset">Reset</button>
        <button type="button" class="btn" id="tuneClose">Close</button>
      </div>
      <div id="tuneRows" class="tune-rows"></div>
      <label class="label" for="tuneText">Current values</label>
      <textarea id="tuneText" rows="6" readonly></textarea>
      <button type="button" class="btn" id="tuneCopy">Copy values</button>
    </aside>
  </main>

  <footer class="status">
    <span>Pen tip: selected tool · Barrel button: clean water · Eraser end: blot · <kbd>Ctrl+Z</kbd> undo · <kbd>[</kbd> <kbd>]</kbd> size · Finger touch does not paint</span>
    <span class="stats" id="stats">–</span>
  </footer>
</div>

<script>
(() => {
"use strict";

// ---------- Pigments ----------
// rgb = colour of a full-strength layer on white paper. Absorbance K = -ln(rgb).
const PIGMENTS = [
  { name: "Hansa yellow",      rgb: [0.98, 0.84, 0.18] },
  { name: "Yellow ochre",      rgb: [0.85, 0.63, 0.31] },
  { name: "Cadmium red",       rgb: [0.86, 0.22, 0.14] },
  { name: "Quinacridone rose", rgb: [0.84, 0.21, 0.47] },
  { name: "Burnt sienna",      rgb: [0.62, 0.31, 0.17] },
  { name: "Sap green",         rgb: [0.37, 0.51, 0.17] },
  { name: "Phthalo blue",      rgb: [0.06, 0.31, 0.56] },
  { name: "Ultramarine",       rgb: [0.21, 0.25, 0.66] },
  { name: "Payne's grey",      rgb: [0.25, 0.28, 0.33] },
];
PIGMENTS.forEach(p => { p.K = p.rgb.map(c => -Math.log(Math.max(c, 0.02))); });
const PAPER_RGB = [0.972, 0.962, 0.935];
// Absorbance saturates at this value in the renderer and the palette swatches.
const KMAX = 4.5;

// ---------- UI state ----------
const ui = {
  colour: 7, mode: 0,
  size: 44, water: 0.6, pigment: 0.55, drying: 45, flow: 0.9, paper: 0.4,
  detail: 2, runsDry: true,
};
const $ = id => document.getElementById(id);
// Frame-loop state. dirty: the canvas needs drawing. lastWet: when paint was last applied.
let dirty = true, lastWet = -1e9, finalDryDone = true;

// ---------- Simulation settings panel ----------
const TUNING = [
  { id: "sps", label: "Simulation steps per second", min: 120, max: 960, step: 60, def: 240,
    desc: "More steps move water and pigment further per second. Uses more GPU time. Above 16 steps per frame is capped." },
  { id: "edge", label: "Edge drying", min: 0, max: 12, step: 0.5, def: 2,
    desc: "How much faster paint dries at its edge. Higher draws more water and pigment toward the edge." },
  { id: "edgeWidth", label: "Edge zone width (px)", min: 1, max: 40, step: 1, def: 6,
    desc: "How far in from the edge the faster drying reaches." },
  { id: "settle", label: "Pigment settling", min: 0, max: 3, step: 0.05, def: 1.2,
    desc: "How fast pigment sticks to the paper while wet, relative to drying speed. Higher keeps pigment where it was painted." },
  { id: "front", label: "Spreading into dry paper", min: 0, max: 0.2, step: 0.005, def: 0.06,
    desc: "How fast a wet area creeps outward over dry paper. Only water above the Flow setting's spread level moves." },
  { id: "pspread", label: "Pigment spread in water", min: 0, max: 0.15, step: 0.005, def: 0.015,
    desc: "How fast pigment spreads through still damp paper. Pooled water on the surface spreads it eight times faster. Higher gives softer wet-in-wet edges but fills blooms back in." },
  { id: "push", label: "Pigment push", min: 0, max: 30, step: 1, def: 10,
    desc: "How strongly a sudden rush of water pushes pigment ahead of it. Makes blooms." },
  { id: "pushMin", label: "Push threshold", min: 0, max: 0.3, step: 0.01, def: 0.12,
    desc: "Difference in water between neighbouring cells before push starts." },
  { id: "speck", label: "Speck smoothing", min: 0, max: 0.2, step: 0.01, def: 0.06,
    desc: "Spreads out single cells that hold much more pigment than a neighbour." },
  { id: "gran", label: "Granulation", min: 0, max: 1, step: 0.05, def: 0.6,
    desc: "How much more pigment settles in the low points of the paper." },
  { id: "lift", label: "Lifting", min: 0, max: 0.0005, step: 0.00001, def: 0.00004,
    desc: "How fast wet paper dissolves dried paint underneath it." },
];
const TUNING_KEY = "wc-tuning-v2";
ui.t = Object.fromEntries(TUNING.map(d => [d.id, d.def]));

const paletteEl = $("palette");
PIGMENTS.forEach((p, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "pan"; b.setAttribute("role", "radio");
  b.setAttribute("aria-label", p.name); b.title = p.name;
  const c = p.K.map((k, j) => Math.round(255 * PAPER_RGB[j] * Math.exp(-KMAX * (1 - Math.exp(-k * 0.85 / KMAX)))));
  b.style.setProperty("--pan", `rgb(${c[0]},${c[1]},${c[2]})`);
  b.setAttribute("aria-checked", i === ui.colour ? "true" : "false");
  b.addEventListener("click", () => selectColour(i));
  paletteEl.appendChild(b);
});
function selectColour(i) {
  ui.colour = i;
  [...paletteEl.children].forEach((b, j) => b.setAttribute("aria-checked", j === i ? "true" : "false"));
  $("colourName").textContent = PIGMENTS[i].name;
  if (ui.mode !== 0) setMode(0);
}
function setMode(m) {
  ui.mode = m;
  document.querySelectorAll("#modes button").forEach(b =>
    b.setAttribute("aria-pressed", Number(b.dataset.mode) === m ? "true" : "false"));
}
document.querySelectorAll("#modes button").forEach(b =>
  b.addEventListener("click", () => setMode(Number(b.dataset.mode))));

function bindSlider(id, fmt, apply) {
  const el = $(id), out = $(id + "Out");
  const upd = () => { apply(Number(el.value)); out.textContent = fmt(Number(el.value)); };
  el.addEventListener("input", upd); upd();
  return el;
}
// Size slider is logarithmic: 0.5 px to 180 px brush width.
const sizeFromSlider = v => 0.5 * Math.pow(360, v / 100);
const fmtSize = d => (d < 10 ? d.toFixed(1) : Math.round(d)) + " px";
const sizeEl = bindSlider("size", v => fmtSize(sizeFromSlider(v)), v => { ui.size = sizeFromSlider(v); });
bindSlider("water", v => v + "%", v => { ui.water = v / 100; });
bindSlider("pigment", v => v + "%", v => { ui.pigment = v / 100; });
bindSlider("drying", v => v + " s", v => { ui.drying = v; });
bindSlider("flow", v => v + "%", v => { ui.flow = v / 100; });
bindSlider("texture", v => v + "%", v => { ui.paper = v / 100; dirty = true; });
$("runsDry").addEventListener("change", e => { ui.runsDry = e.target.checked; });

try {
  const saved = JSON.parse(localStorage.getItem(TUNING_KEY) || "{}");
  for (const d of TUNING) if (typeof saved[d.id] === "number") ui.t[d.id] = saved[d.id];
} catch (e) {}
const decimals = st => (String(st).split(".")[1] || "").length;
const tuneRows = $("tuneRows"), tuneText = $("tuneText");
function tuneSummary() {
  return TUNING.map(d => `${d.label}: ${ui.t[d.id].toFixed(decimals(d.step))}`).join("\n")
    + `\nFlow: ${Math.round(ui.flow * 100)}%, Water: ${Math.round(ui.water * 100)}%, Paint: ${Math.round(ui.pigment * 100)}%`
    + `, Drying time: ${ui.drying} s, Size: ${fmtSize(ui.size)}, Detail: ${$("detail").selectedOptions[0].textContent}`;
}
function tuneShow() { tuneText.value = tuneSummary(); }
// Saved only when the user changes a value, so new defaults are not pinned by an old save.
function tuneSave() {
  tuneShow();
  try { localStorage.setItem(TUNING_KEY, JSON.stringify(ui.t)); } catch (e) {}
}
for (const d of TUNING) {
  const row = document.createElement("div");
  row.className = "tune-row";
  const inputId = "tune-" + d.id;
  row.innerHTML = `<label for="${inputId}">${d.label}</label>
    <div class="tune-ctl"><input type="range" id="${inputId}" min="${d.min}" max="${d.max}" step="${d.step}">
    <output></output></div><p class="tune-desc">${d.desc}</p>`;
  const input = row.querySelector("input"), out = row.querySelector("output");
  input.value = ui.t[d.id];
  const show = () => { out.textContent = ui.t[d.id].toFixed(decimals(d.step)); };
  input.addEventListener("input", () => { ui.t[d.id] = Number(input.value); show(); tuneSave(); });
  show();
  d.input = input; d.show = show;
  tuneRows.appendChild(row);
}
$("tuneOpen").addEventListener("click", () => { $("tuning").hidden = !$("tuning").hidden; tuneShow(); });
$("tuneClose").addEventListener("click", () => { $("tuning").hidden = true; });
$("tuneReset").addEventListener("click", () => {
  for (const d of TUNING) { ui.t[d.id] = d.def; d.input.value = d.def; d.show(); }
  tuneSave();
});
$("tuneCopy").addEventListener("click", () => {
  tuneShow();
  const done = () => { $("tuneCopy").textContent = "Copied"; setTimeout(() => { $("tuneCopy").textContent = "Copy values"; }, 1500); };
  const fallback = () => { tuneText.focus(); tuneText.select(); $("tuneCopy").textContent = "Selected, press Ctrl+C"; };
  try { navigator.clipboard.writeText(tuneText.value).then(done, fallback); } catch (e) { fallback(); }
});
tuneShow();

// ---------- WebGL setup ----------
const canvas = $("paper");
const stage = $("stage");
const msg = $("msg");
function fail(text) { msg.textContent = text; msg.hidden = false; }

const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, desynchronized: true, preserveDrawingBuffer: false });
if (!gl) { fail("This browser did not provide WebGL 2, which the simulation needs. Try Edge or Chrome with hardware acceleration turned on."); return; }
if (!gl.getExtension("EXT_color_buffer_float")) { fail("This browser cannot render to floating-point textures (EXT_color_buffer_float), which the simulation needs."); return; }
// The GPU can drop the context (driver reset, the tab left in the background too long, a very
// large grid). The painting is gone with it, so say so instead of showing a black canvas.
canvas.addEventListener("webglcontextlost", e => {
  e.preventDefault();
  contextLost = true;
  fail("The graphics context was lost, so the painting could not be kept. Reload the page to start again.");
});
let contextLost = false;

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

// One simulation step: water flow, pigment carried by the water, evaporation, deposition.
const FS_STEP = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uWP; uniform sampler2D uD; uniform sampler2D uPaper;
uniform float uPaperScale, uK, uEvap, uDep, uGran, uLift, uSpread, uFront, uDryAll, uPush, uPD, uPDPool, uMaskStep, uEdge, uPushMin, uSpeck;
layout(location=0) out vec4 oWP;
layout(location=1) out vec4 oD;
const float WET = 0.008;
const float DRY = 0.004;
float paperAt(ivec2 c){ return texture(uPaper, (vec2(c)+0.5)*uPaperScale).r; }
// Water that a wet cell at level Ww hands to a dry neighbour whose paper height is hRecv.
// Only water above the spread level moves, and hollows in the paper take it first, so the
// front creeps outward with a ragged edge that follows the paper. Both cells of a pair
// compute the same amount, so water is conserved.
float front(float Ww, float hRecv){ return uFront * max(Ww - uSpread, 0.0) * (0.3 + 0.7 * (1.0 - hRecv)); }
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  ivec2 sz = textureSize(uWP, 0);
  vec4 s = texelFetch(uWP, c, 0);
  vec4 dd = texelFetch(uD, c, 0);
  vec3 P = s.rgb; float W = s.a; vec3 D = dd.rgb;
  if (uDryAll > 0.5) { oWP = vec4(0.0); oD = vec4(D + P, 0.0); return; }
  float h = paperAt(c);
  bool cWet = W > WET;
  float dW = 0.0; vec3 dP = vec3(0.0); vec3 dD = vec3(0.0);
  // D.a holds how far inside the wet area this cell is: 0 at the edge, rising to 1 one
  // edge-zone width in. It is a distance field relaxed one step at a time: each wet cell
  // sits a little above its neighbours, each dry cell is 0.
  float Mmin = 1.0, Msum = 0.0;
  for (int i = 0; i < 4; i++) {
    ivec2 o = i==0 ? ivec2(1,0) : i==1 ? ivec2(-1,0) : i==2 ? ivec2(0,1) : ivec2(0,-1);
    ivec2 n = c + o;
    if (n.x < 0 || n.y < 0 || n.x >= sz.x || n.y >= sz.y) { Mmin = min(Mmin, dd.a); Msum += dd.a; continue; }
    vec4 dn = texelFetch(uD, n, 0);
    Mmin = min(Mmin, dn.a); Msum += dn.a;
    vec4 sn = texelFetch(uWP, n, 0);
    float Wn = sn.a; bool nWet = Wn > WET;
    float hn = paperAt(n);
    bool bothWet = cWet && nWet;
    // Water above the spread level is a free pool on the surface. Below it the water is held
    // in the paper (damp), where it moves slowly and cannot spread on its own.
    bool cPool = W > uSpread, nPool = Wn > uSpread;
    float f = 0.0, Wrecv = 0.0;
    bool isFront = false;
    if (cPool == nPool) {
      // Two pooled cells, or two damp cells, exchange water by diffusion.
      if (bothWet) {
        float perm = uK * (0.2 + 0.6 * (h + hn)) * (cPool ? 1.0 : 0.25);

const FS_BRUSH = `#version 300 es

uniform sampler2D uWP; uniform sampler2D uD; uniform sampler2D uPaper;

// Copy state into a grid of another size. Positions map through screen position, top-left anchored.
const FS_COPY = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uWP; uniform sampler2D uD; uniform float uRatio;
layout(location=0) out vec4 oWP;
layout(location=1) out vec4 oD;
void main(){

// Draw: paper texture with light from the top left, pigment by Beer-Lambert absorbance.

    gl.uniform1i(u.uMode, mode);
    gl.uniform3fv(u.uColK, PIGMENTS[batch[0].colour].K);
    gl.uniform1f(u.uWater, batch[0].water);
    gl.uniform1f(u.uPigment, batch[0].pigment);
    gl.uniform1f(u.uLoad, ui.runsDry ? batch[0].load : 1);
    gl.uniform1f(u.uPigLoad, ui.runsDry ? batch[0].pload : 1);
    drawTo(sim.next); swap();
  }
}

function render() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  bindInputs(progRender, sim.cur);
  const u = progRender.u;
  gl.uniform1f(u.uDpr, dpr);
  gl.uniform1f(u.uSimScale, sim.scale);
  gl.uniform1f(u.uCanvasH, canvas.height);
  gl.uniform3fv(u.uPaperRGB, PAPER_RGB);
  gl.uniform1f(u.uSmooth, floatLinear ? 1 : 0);
  gl.uniform1f(u.uPaperStrength, ui.paper);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- Sizing ----------
let dpr = window.devicePixelRatio || 1;
let cssW = 0, cssH = 0;
function onResize() {
  const r = stage.getBoundingClientRect();
  // A hidden stage reports no size. Keep the grid, or the painting would be thrown away.
  if (r.width < 2 || r.height < 2 || contextLost) return;
  dpr = window.devicePixelRatio || 1;
  cssW = Math.max(1, Math.round(r.width)); cssH = Math.max(1, Math.round(r.height));
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  resizeSim(cssW, cssH, ui.detail);
  dirty = true;
}
new ResizeObserver(onResize).observe(stage);
$("detail").addEventListener("change", e => {
  ui.detail = Number(e.target.value);
  resizeSim(cssW, cssH, ui.detail);
  lastWet = performance.now(); dirty = true;
});

// ---------- Pen input ----------
const queue = [];
const dbg = { stamps: 0, dwell: 0 };
let stroke = null;
const ring = $("ring");

function pointOf(e) {
  const r = canvas.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
function pressureOf(e) {
  if (e.pointerType === "mouse") return 0.6;
  return e.pressure > 0 ? e.pressure : 0.5;
}
// Base stroke length in CSS px for the brush to run down. Water and pigment each scale it by the Water setting.
const LOAD_LENGTH = 700;
function radiusFor(p) { return (ui.size / 2) * (0.25 + 0.75 * Math.pow(p, 0.8)); }

function addStamp(x, y, p, amtScale = 1) {
  const r = radiusFor(p);
  queue.push({
    // A brush narrower than one grid cell still paints one cell, with less paint.
    x: x * sim.scale, y: y * sim.scale, r: Math.max(0.5, r * sim.scale),
    amt: (0.4 + 0.6 * p) * amtScale * Math.min(1, (r * sim.scale) / 0.5),
    mode: stroke.mode, colour: stroke.colour, water: stroke.water, pigment: stroke.pigment,
    load: stroke.load, pload: stroke.pload,
  });
  stroke.lastStamp = performance.now(); dbg.stamps++;
}
function addSegment(x, y, p) {
  const [lx, ly] = stroke.last, lp = stroke.lastP;
  const dist = Math.hypot(x - lx, y - ly);
  const spacing = Math.max(0.75, radiusFor(Math.max(p, lp)) * 0.18);
  const n = Math.floor(dist / spacing);
  for (let i = 1; i <= n; i++) {
    const t = (i * spacing) / dist;
    addStamp(lx + (x - lx) * t, ly + (y - ly) * t, lp + (p - lp) * t);
    if (stroke.mode !== 2) {
      // A wet brush keeps its water longer but its pigment is diluted and runs out first.
      // A dry brush (mostly paint) runs out of water first and breaks up on the paper.
      const w = stroke.water;
      stroke.load *= Math.exp(-spacing / (LOAD_LENGTH * (0.45 + 1.55 * w)));
      stroke.pload *= Math.exp(-spacing / (LOAD_LENGTH * (0.5 + 1.0 * (1 - w))));
    }
  }
  if (n > 0) {
    const t = (n * spacing) / dist;
    stroke.last = [lx + (x - lx) * t, ly + (y - ly) * t];
    stroke.lastP = lp + (p - lp) * t;
  }
}

canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  let mode = ui.mode;
  if (e.button === 5 || (e.buttons & 32)) mode = 2;          // pen eraser end
  else if (e.button === 2 || (e.buttons & 2)) mode = 1;      // pen barrel button or right mouse button
  snapshot();
  const [x, y] = pointOf(e), p = pressureOf(e);
  stroke = { id: e.pointerId, mode, colour: ui.colour, water: ui.water, pigment: ui.pigment,
             load: 1, pload: 1, last: [x, y], lastP: p, lastStamp: 0 };
  addStamp(x, y, p);
  moveRing(e);
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  moveRing(e);
  if (!stroke || e.pointerId !== stroke.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const [x, y] = pointOf(ev);
    addSegment(x, y, pressureOf(ev));
  }
});
function endStroke(e) { if (stroke && e.pointerId === stroke.id) stroke = null; }
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);
canvas.addEventListener("pointerleave", e => { if (!stroke) ring.hidden = true; });
canvas.addEventListener("contextmenu", e => e.preventDefault());

function moveRing(e) {
  if (e.pointerType === "touch") return;
  const [x, y] = pointOf(e);
  const p = stroke ? pressureOf(e) : 1;
  const r = radiusFor(p);
  ring.hidden = false;
  const rr = Math.max(r, 2);
  ring.style.width = ring.style.height = (2 * rr) + "px";
  ring.style.transform = `translate(${x - rr}px, ${y - rr}px)`;
}

// ---------- Buttons and keys ----------
$("undo").addEventListener("click", undo);
$("dryNow").addEventListener("click", () => { dryAll(); dirty = true; });
$("clear").addEventListener("click", () => {
  snapshot(); clearPair(sim.cur); clearPair(sim.next); dirty = true;
});
window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  else if (e.key === "[" || e.key === "]") {
    const v = Math.min(100, Math.max(0, Number(sizeEl.value) + (e.key === "]" ? 4 : -4)));
    sizeEl.value = v; sizeEl.dispatchEvent(new Event("input"));
  }
});

// ---------- Frame loop ----------
let lastT = performance.now(), fps = 60, statsT = 0, simDebt = 0, lagging = false;
const statsEl = $("stats");
function frame(t) {
  if (contextLost) return;
  const dt = Math.min(0.1, Math.max(0.001, (t - lastT) / 1000));
  lastT = t; dbg.frames = (dbg.frames || 0) + 1;
  fps = fps * 0.92 + (1 / dt) * 0.08;

  if (stroke && performance.now() - stroke.lastStamp > 70) { dbg.dwell++; addStamp(stroke.last[0], stroke.last[1], stroke.lastP, 0.5); }
  if (queue.length) { flushStamps(); lastWet = t; finalDryDone = false; dirty = true; }

  // A large wash can stay wet for about twice the drying time. After that whatever is left
  // is dried in one go.
  const active = t - lastWet < (ui.drying * 2 + 5) * 1000;
  let steps = 0;
  if (active) {
    // Steps owed accumulate across frames, so a slow or uneven frame rate still runs the
    // simulation at the set rate. Above 16 steps per frame the simulation falls behind real time.
    simDebt = Math.min(simDebt + dt * ui.t.sps, 64);
    steps = Math.min(16, Math.floor(simDebt));
    simDebt -= steps;
    lagging = simDebt >= 16;
    for (let i = 0; i < steps; i++) stepSim();
    if (steps) dirty = true;
  } else {
    simDebt = 0; lagging = false;
  }
  if (!active && !finalDryDone) {
    dryAll(); finalDryDone = true; dirty = true;
  }
  if (dirty) { render(); dirty = false; }

  if (t - statsT > 500) {
    statsT = t;
    statsEl.textContent = `${Math.round(fps)} fps · ${active ? steps + " steps/frame" + (lagging ? " (behind)" : "") : "idle"} · grid ${sim.w}×${sim.h}${floatLinear ? "" : " · smooth edges unavailable"}`;
  }
  requestAnimationFrame(frame);
}
onResize();
requestAnimationFrame(frame);

// Test hook for automated checks.
window.__wc = { sim, ui, stepSim, dryAll, render, flushStamps, queue, gl, dbg, get stroke() { return stroke; } };
})();
</script>

</body>
</html>
